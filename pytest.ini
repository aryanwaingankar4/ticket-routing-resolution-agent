[pytest]
testpaths = tests
python_files = test_*.py

# Markers keep the default run fast and offline.
#   slow   -- needs BGE + a fresh Tier-1 fit (~1 min first use, then cached)
#   gemini -- makes a real API call; costs free-tier quota
markers =
    slow: requires loading production models
    gemini: requires a live Gemini API call and quota

# Never hit the network by default. Run the full suite with:
#     pytest -m ""
# and the Gemini-dependent tests with:
#     pytest -m gemini
addopts = -m "not gemini" --strict-markers -q

filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
